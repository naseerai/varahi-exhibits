
services:
  ticketing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-ticketing
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      WEB_CONCURRENCY: 1

    volumes:
      - ./data:/app/data

    init: true
